name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

env:
  CLIENT_ID: meirapresentes

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configurar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Atualizar landing na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s -- "$CLIENT_ID" <<'REMOTE'
          set -euo pipefail
          cd "/opt/frontly/clients/$1/landing/app"
          git fetch --depth 1 origin main
          git reset --hard origin/main
          npm ci --no-audit --no-fund
          npm run package:deploy
          echo "DEPLOY_OK:$1"
          REMOTE