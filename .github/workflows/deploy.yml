name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

env:
  CLIENT_ID: meirapresentes

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configurar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub || { echo '::error::VPS_SSH_KEY invalida (cole a chave privada completa)'; exit 1; }
          ssh-keygen -lf ~/.ssh/id_deploy.pub
          ssh-keyscan -H "$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')" >> ~/.ssh/known_hosts

      - name: Atualizar landing na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          HOST="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"; LOGIN="$(printf '%s' "$VPS_USER" | tr -d '[:space:]')"; ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$LOGIN@$HOST" bash -s -- "$CLIENT_ID" <<'REMOTE'
          set -euo pipefail
          cd "/opt/frontly/clients/$1/landing/app"
          git fetch --depth 1 origin main
          git reset --hard origin/main
          npm ci --no-audit --no-fund
          npm run package:deploy
          echo "DEPLOY_OK:$1"
          REMOTE